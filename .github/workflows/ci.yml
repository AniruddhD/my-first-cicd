name: Simple CI Pipeline

on:
  push: 
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code Uthao
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies install
        run: pip install -r requirements.txt

      - name: Tests chalao
        run: pytest

        
        
